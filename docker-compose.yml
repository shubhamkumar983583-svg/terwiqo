services:
  postgres:
    image: postgres:16-alpine
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workpulse_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-workpulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: workpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-workpulse_redis_2026}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "workpulse_redis_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: workpulse-minio-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-workpulse_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-workpulse_minio_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    container_name: workpulse-backend-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://workpulse:workpulse_secret_2026@postgres:5432/workpulse_db
      REDIS_URL: redis://:workpulse_redis_2026@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: workpulse_minio_admin
      S3_SECRET_KEY: workpulse_minio_secret_2026
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    container_name: workpulse-web-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend-api:8080/api/v1
    depends_on:
      - backend-api
    ports:
      - "3000:3000"

  cctv-local-agent:
    image: python:3.11-slim
    container_name: workpulse-cctv-agent
    restart: unless-stopped
    environment:
      AGENT_NODE_ID: "AGENT-MUNICH-HQ-01"
      INGESTION_SERVER_URL: "http://backend-api:8080/api/v1/attendance/cctv-punch"
      RTSP_STREAM_CAMERA_1: "rtsp://camera.internal.lan/live"
      DETECTION_CONFIDENCE_THRESHOLD: "0.88"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
  minio_data:
